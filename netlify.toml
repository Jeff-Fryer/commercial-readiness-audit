# Netlify build configuration — repo root.
#
# `base` is the important line. It points Netlify at function/, where package.json
# lives, so Netlify's build system runs `npm install` there itself. That is what
# removes the need for Node on any local machine, now and for future changes.
#
# Every other path here is resolved relative to `base`:
#   publish   -> function/public
#   functions -> function/netlify/functions
#
# The function declares its own route (/api/website-check) via the exported
# `config.path`, so no redirects are needed.

[build]
  base = "function"
  command = ""
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Forms
#
# The audit posts leads to the Netlify form named `crg-audit`. Netlify registers
# a form by scanning the deployed HTML at build time, so `function/public/index.html`
# carries a hidden static twin of the visible form; every field name that gets
# POSTed is declared there. The visible form is submitted with fetch, and a failed
# post is swallowed on purpose: a CEO still gets their score.
#
# Form detection must be enabled once for the project, under
# Project configuration -> Forms. Submission notifications (email to Jeff, or a
# webhook into the CRM) are configured in the Netlify UI, not here: Netlify has
# no netlify.toml key for form notifications.
